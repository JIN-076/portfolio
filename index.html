<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홍지인 · 백엔드 엔지니어 포트폴리오</title>
<meta name="description" content="홍지인 백엔드 엔지니어 포트폴리오 (PDF).">
<meta property="og:title" content="홍지인 · 백엔드 엔지니어 포트폴리오">
<meta property="og:type" content="website">
<style>
  :root{ --bg:#1b1b1f; --fg:#e7e9ee; --sub:#a1a1aa; --hair:#2e2e33; --em:#10b981; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:-apple-system,"Segoe UI",system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .viewer{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  /* 플로팅 다운로드 버튼 */
  .dl{position:fixed;top:14px;right:14px;z-index:10;display:inline-flex;align-items:center;gap:7px;
    background:var(--em);color:#07140f;text-decoration:none;font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:9px;box-shadow:0 6px 20px -6px rgba(0,0,0,.5);transition:filter .15s}
  .dl:hover{filter:brightness(1.07)}
  .dl svg{width:15px;height:15px}
  /* iframe 이 PDF 를 인라인 못하는 환경(일부 모바일)용 폴백 */
  .fallback{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:32px;text-align:center}
  .fallback h1{font-size:19px;font-weight:700;margin:0}
  .fallback p{font-size:13.5px;color:var(--sub);margin:0;max-width:34ch;line-height:1.6}
  .fallback a{display:inline-flex;align-items:center;gap:8px;background:var(--em);color:#07140f;
    text-decoration:none;font-size:14px;font-weight:600;padding:11px 20px;border-radius:10px}
  .no-inline .viewer{display:none}
  .no-inline .fallback{display:flex}
</style>
</head>
<body>
  <!-- 기존 URL(jin-076.github.io/portfolio) 그대로, 이제 PDF 포트폴리오를 전체화면으로 보여줍니다. -->
  <iframe class="viewer" src="portfolio.pdf#view=FitH" title="홍지인 백엔드 엔지니어 포트폴리오"></iframe>

  <a class="dl" href="portfolio.pdf" download="홍지인_백엔드_엔지니어_포트폴리오.pdf">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
    PDF 다운로드
  </a>

  <!-- PDF 인라인 미지원(주로 모바일) 폴백 -->
  <div class="fallback">
    <h1>홍지인 · 백엔드 엔지니어 포트폴리오</h1>
    <p>이 브라우저에서는 PDF 미리보기가 지원되지 않습니다. 아래 버튼으로 열거나 내려받으세요.</p>
    <a href="portfolio.pdf">포트폴리오 PDF 열기 ↗</a>
  </div>

  <script>
    // 모바일 등 iframe 인라인 PDF 미지원 추정 시 폴백으로 전환(휴리스틱: 터치+소형 화면).
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile = /iPhone|iPad|iPod|Android/i.test(ua);
      if (isMobile) document.documentElement.classList.add('no-inline');
    })();
  </script>
</body>
</html>
